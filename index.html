<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Script Copier</title>
  <style>
    body {
      background-color: #a259ff;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 2px 2px #7a32cc;
    }

    textarea {
      width: 90%;
      max-width: 600px;
      height: 250px;
      padding: 15px;
      font-size: 16px;
      font-family: monospace;
      border-radius: 15px;
      border: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      resize: none;
    }

    button {
      margin-top: 20px;
      background-color: #00d1c1;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px #007e7b;
      transition: 0.2s;
    }

    button:hover {
      background-color: #00b0a5;
    }
  </style>
</head>
<body>

  <h1>Script Copier</h1>
  <textarea id="scriptBox">// Paste your script here...</textarea>
  <br>
  <button onclick="copyScript()">Copy Script</button>

  <script>
    function copyScript() {
      const textArea = document.getElementById("scriptBox");
      textArea.select();
      document.execCommand("copy");
      alert("Script copied to clipboard!");
    }
  </script>

</body>
</html>
